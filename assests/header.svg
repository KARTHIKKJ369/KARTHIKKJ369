<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="15%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="85%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="#0d1117"/>

  <!-- very subtle red glow behind name -->
  <ellipse cx="600" cy="140" rx="320" ry="80" fill="#e8384f" opacity="0.04"/>

  <!-- name -->
  <text
    x="600" y="148"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-size="76"
    font-weight="700"
    fill="#f8fafc"
    text-anchor="middle"
    letter-spacing="-1"
  >Karthik Jayan</text>

  <!-- red rule -->
  <rect x="560" y="168" width="80" height="2" fill="#e8384f" rx="1"/>

  <!-- subtitle -->
  <text
    x="600" y="206"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-size="13"
    fill="#4b5563"
    text-anchor="middle"
    letter-spacing="4"
    font-weight="500"
  >AI SYSTEMS  ·  RAG  ·  MULTI-AGENT  ·  EDGE IOT</text>

  <!-- edge fade overlays for clean bleed -->
  <rect width="1200" height="300" fill="url(#fade)"/>
</svg>
